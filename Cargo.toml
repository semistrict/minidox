[workspace]
members = [
    "crates/minidox-cache",
    "crates/minidox-fork",
    "crates/minidox-redoxfs",
    "crates/minidox-vmm",
]
exclude = [
    "vendor/cloud-hypervisor",
    "vendor/redox-kernel",
    "vendor/redoxfs",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/semistrict/minidox"
readme = "README.md"
publish = false

[workspace.dependencies]
bitflags = "2.13.1"
libc = "0.2.189"
minidox-cache = { path = "crates/minidox-cache" }
redoxfs = { path = "vendor/redoxfs", default-features = false, features = ["std"] }
redox_syscall = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.18"
