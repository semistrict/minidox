[package]
name = "minidox-vmm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cloud-hypervisor = { package = "vmm", path = "../../vendor/cloud-hypervisor/vmm", features = ["kvm"] }
cloud-hypervisor-hypervisor = { package = "hypervisor", path = "../../vendor/cloud-hypervisor/hypervisor", features = ["kvm"] }
libc.workspace = true
minidox-cache.workspace = true
minidox-redoxfs = { path = "../minidox-redoxfs" }
seccompiler = "0.5.0"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
vmm-sys-util = "0.15.0"
virtio-devices = { path = "../../vendor/cloud-hypervisor/virtio-devices", features = ["kvm"] }
vm-migration = { path = "../../vendor/cloud-hypervisor/vm-migration" }
