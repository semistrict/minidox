[package]
name = "minidox-vmm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cloud-hypervisor = { package = "vmm", path = "../../vendor/cloud-hypervisor/vmm", features = ["kvm"] }
cloud-hypervisor-hypervisor = { package = "hypervisor", path = "../../vendor/cloud-hypervisor/hypervisor", features = ["kvm"] }
seccompiler = "0.5.0"
vmm-sys-util = "0.15.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = "1.0.151"
